<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masihi Geet — Admin Sign In</title>
<style>
[hidden]{display:none!important}button:disabled{opacity:.5;cursor:wait}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#171717;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}h1{margin:0 0 6px;font-size:25px}p{color:#666;font-size:14px;line-height:1.5}label{display:block;font-size:12px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 6px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font:inherit}button{width:100%;margin-top:14px;border:0;border-radius:9px;padding:13px;background:#111;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.back{display:inline-block;margin-top:16px;color:#555;font-size:13px;text-decoration:none}.error{display:none;background:#ffe4e4;color:#a00000;padding:10px;border-radius:8px;font-size:13px;margin-top:12px}.error.show{display:block}.admin{display:none}.admin.show{display:block}.signed{background:#eaf7ea;color:#176b17;padding:12px;border-radius:9px;margin:15px 0;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>Admin Sign In</h1>
<p>Use the site owner’s Google account to edit songs. Everyone can browse songs without signing in.</p>
<button id="googleSignIn" disabled>Continue with Google</button>
<p id="authStatus" role="status" aria-live="polite">Loading Google sign-in…</p>
<button id="signOut" hidden style="background:#e9e9e9;color:#111" onclick="mgSignOut()">Sign out</button>
<a class="back" href="index.html">← Back to website</a>
<noscript><p>JavaScript is required for Google sign-in.</p></noscript>
</div>
<script src="firebase-config.js"></script>
<script src="auth.js?v=420ad117"></script>
<script src="login.js"></script>
</body>
</html>
